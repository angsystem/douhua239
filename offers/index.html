<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8ef" />
  <meta name="description" content="逗花豆花優惠專區｜最新優惠、限定活動與新品消息。" />
  <title>優惠專區｜逗花豆花</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
  <style>
    .offers-page{min-height:calc(100vh - 160px);display:grid;place-items:center;padding:96px 24px 64px;background:linear-gradient(180deg,#fff8ef 0%,#fffdf9 100%)}
    .offers-wrap{width:min(760px,100%);text-align:center}
    .offers-kicker{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid rgba(60,42,28,.14);border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.12em;margin-bottom:24px;background:rgba(255,255,255,.7)}
    .offers-card{position:relative;overflow:hidden;padding:56px 28px;border-radius:32px;background:#fff;border:1px solid rgba(60,42,28,.1);box-shadow:0 20px 60px rgba(90,61,34,.09)}
    .offers-card:before{content:"逗";position:absolute;right:-12px;top:-54px;font-size:190px;font-weight:900;line-height:1;color:rgba(226,168,63,.09);pointer-events:none}
    .offers-icon{width:84px;height:84px;margin:0 auto 24px;display:grid;place-items:center;border-radius:28px;background:#fff2c9;font-size:38px;transform:rotate(-4deg)}
    .offers-card h1{position:relative;margin:0 0 14px;font-size:clamp(32px,7vw,54px);line-height:1.15;letter-spacing:-.04em;color:#342719}
    .offers-card .status{position:relative;margin:0 auto;color:#766656;font-size:16px;line-height:1.9;max-width:520px}
    .offers-card .status strong{color:#342719}
    .offers-actions{position:relative;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:32px}
    .offers-actions a{min-width:160px}
    .offers-note{margin-top:22px;color:#9a8978;font-size:13px;line-height:1.7}
    .offers-social{display:flex;justify-content:center;gap:18px;margin-top:26px;font-size:14px;font-weight:700}
    .offers-social a{color:#5b4938;text-decoration:none;border-bottom:1px solid rgba(91,73,56,.25);padding-bottom:2px}
    @media (max-width:640px){
      .offers-page{padding:80px 16px 44px}
      .offers-card{padding:44px 20px;border-radius:26px}
      .offers-actions{flex-direction:column}
      .offers-actions a{width:100%}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../" aria-label="回逗花豆花首頁">
      <span class="brand-mark">逗</span>
      <span class="brand-name">逗花豆花</span>
    </a>
    <nav style="display:flex">
      <a href="../">回首頁</a>
    </nav>
  </header>

  <main class="offers-page">
    <section class="offers-wrap" aria-labelledby="offers-title">
      <div class="offers-kicker">DOUHUA 239 · OFFERS</div>
      <div class="offers-card">
        <div class="offers-icon" aria-hidden="true">✦</div>
        <h1 id="offers-title">優惠，正在醞釀中。</h1>
        <p class="status"><strong>目前沒有進行中的優惠活動。</strong><br>下一次的限定活動、新品消息與門市優惠，會在這裡第一時間更新。</p>
        <div class="offers-actions">
          <a class="btn primary" href="../">回逗花首頁</a>
          <a class="btn ghost" href="https://www.instagram.com/douhua239/" target="_blank" rel="noopener">追蹤 Instagram</a>
        </div>
        <div class="offers-social">
          <a href="https://www.facebook.com/douhua239/" target="_blank" rel="noopener">Facebook ↗</a>
          <a href="tel:0492980258">門市電話 049-2980258</a>
        </div>
        <p class="offers-note">優惠內容依門市現場與官方公告為準。</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="brand footer-brand"><span class="brand-mark">逗</span><span class="brand-name">逗花豆花</span></div>
    <p>© 2026 逗花豆花 · Puli, Nantou</p>
  </footer>
</body>
</html>
